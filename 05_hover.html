<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }
            body {
                height: 100vh;
                background-image: linear-gradient(to top, #fbc2eb 0%, #a6c1ee 100%);
            }
            .hover_wrap {
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;

                perspective: 1000px;
            }
            .effect {
                width: 400px;
                height: 266px;
                margin: 10px;
                position: relative;
                transform-style: preserve-3d;
            }

            .effect img {
                width: 100%;
                display: block;
            }
            .effect .front {
                position: absolute;
                left: 0;
                top: 0;
                transform-style: preserve-3d;
            }
            .effect .back {
                position: absolute;
                left: 0;
                top: 0;
                transform-style: preserve-3d;
            }
            /* figcaption */
            figcaption {
                width: 80%;
                padding: 4%;
                box-sizing: border-box;
                background-color: rgba(255, 255, 255, 0.5);
                transform: translate(15%, -80%);

                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%) translateZ(50px);
            }
            /* hover */
            .hover1 .front {
                transition: all 1s;
                backface-visibility: hidden;
                transform: rotateY(0);
            }

            .hover1:hover .front {
                transform: rotateY(180deg);
            }

            .hover1 .back {
                transition: all 1s;
                backface-visibility: hidden;
                transform: rotateY(-180deg);
            }

            .hover1:hover .back {
                transform: rotateY(0);
            }

            /* hover2 */
            .hover2 .front {
                transform: rotateX(0);
                transition: all 1s;
                backface-visibility: hidden;
            }

            .hover2:hover .front {
                transform: rotateX(180deg);
            }

            .hover2 .back {
                transition: all 1s;
                backface-visibility: hidden;
                transform: rotateX(-180deg);
            }

            .hover2:hover .back {
                transform: rotateX(0deg);
            }
        </style>
    </head>

    <body>
        <div class="hover_wrap">
            <div class="effect hover1">
                <figure class="front">
                    <img src="img/robert-ritchie-MzbMuF0sv1I-unsplash.jpg" alt="" />
                    <figcaption>
                        <h3>MOUSE OVER</h3>
                        <p>마우스 오버효과 "앞면"입니다</p>
                    </figcaption>
                </figure>

                <figure class="back">
                    <img src="img/nir-himi-EQdPHtE86UI-unsplash.jpg" alt="" />
                    <figcaption>
                        <h3>MOUSE OVER</h3>
                        <p>마우스 오버효과 "뒷면"입니다</p>
                    </figcaption>
                </figure>
            </div>

            <div class="effect hover2">
                <figure class="front">
                    <img src="img/nir-himi-EQdPHtE86UI-unsplash.jpg" alt="" />
                    <figcaption>
                        <h3>MOUSE OVER</h3>
                        <p>마우스 오버효과 "앞면"입니다</p>
                    </figcaption>
                </figure>

                <figure class="back">
                    <img src="img/sayan-nath-iAReN0zr8_U-unsplash.jpg" alt="" />
                    <figcaption>
                        <h3>MOUSE OVER</h3>
                        <p>마우스 오버효과 "뒷면"입니다</p>
                    </figcaption>
                </figure>
            </div>
        </div>
    </body>
</html>
